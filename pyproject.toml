[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dealsynq-ocr-pipeline"
version = "0.4.1"
description = "Evidence-first PDF pipeline through Unified Source Blocks"
requires-python = ">=3.11"
dependencies = [
  "pdfplumber>=0.11",
  "pypdf>=5",
  "Pillow>=10",
]

[project.optional-dependencies]
ocr = ["rapidocr>=3.9.2", "onnxruntime>=1.20", "opencv-python-headless>=4.10"]
dev = ["pytest>=8"]
validate = ["jsonschema>=4.23"]

[project.scripts]
dealsynq-ocr = "ocr_pipeline.cli:main"
dealsynq-validate-source-blocks = "ocr_pipeline.validate_run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ocr_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
